# The pedal's Plymouth theme, installed explicitly. The 45plymouth dracut module runs
# plymouth-populate-initrd, which copies a custom theme only when it can resolve ThemeDir from
# plymouthd.conf; relying on that left splash.png out of the pedal kernel's initrd (the image
# build's check caught it). install_items is the direct instruction, and the theme is 20 KB.
install_items+=" /usr/share/plymouth/themes/pedal/splash.png /usr/share/plymouth/themes/pedal/pedal.plymouth /usr/share/plymouth/themes/pedal/pedal.script /etc/plymouth/plymouthd.conf "
