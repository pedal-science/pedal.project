# The pedal's additions to namchain's own unit (packaging/systemd/namchaind.service, installed
# beside the binaries by scripts/deploy-engine).
[Unit]
# The token is generated on the host by deploy-engine and never leaves it.
ConditionPathExists=/etc/namchain/token

[Service]
ExecStart=
ExecStart=/opt/namchain/current/bin/namchaind --config /etc/namchain/namchaind.json
# The only slice allowed on the render core (pedal-rt.slice). A service gets no limits.d, which is
# why the unit itself sets LimitRTPRIO and LimitMEMLOCK.
Slice=pedal-rt.slice
# Resume at power-up: start from the last rig pedal-resume saved, or the default one if there is
# none yet. Seeding never fails the start; namchaind starts silent without a rig.
ExecStartPre=-/usr/local/sbin/pedal-resume seed
