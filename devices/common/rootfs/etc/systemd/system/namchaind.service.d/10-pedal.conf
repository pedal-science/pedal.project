# The pedal's additions to namchain's own unit (packaging/systemd/namchaind.service, installed
# beside the binaries by scripts/deploy-engine).
[Unit]
# The TCP token. One token for every Core host, kept in 1Password (vault fx, item namchaind), so
# ljoss connects to any of them unchanged: vip's image build installs it, and deploy-engine makes
# one only on a host that has none.
ConditionPathExists=/etc/namchain/token

[Service]
ExecStart=
ExecStart=/opt/namchain/current/bin/namchaind --config /etc/namchain/namchaind.json
# The only slice allowed on the render core (pedal-rt.slice). A service gets no limits.d, which is
# why the unit itself sets LimitRTPRIO and LimitMEMLOCK.
Slice=pedal-rt.slice
# The control thread compiles and prewarms rigs: ~20 ms of work per rig switch. namchain's unit runs
# the whole process SCHED_FIFO 80, which puts that thread at the render thread's priority and lets
# it onto core 3. Keep it on the housekeeping cores at normal priority instead; the render thread
# still pins itself to core 3 and takes SCHED_FIFO 80 itself (rt_priority, cpu in namchaind.json).
CPUAffinity=0-1
CPUSchedulingPolicy=other
CPUSchedulingPriority=
# Resume at power-up: start from the last rig pedald saved, or the default one if there is
# none yet. Seeding never fails the start; namchaind starts silent without a rig. It runs as
# root, which is how the tree under /var/lib/pedal comes to belong to the service's user.
ExecStartPre=-/usr/local/sbin/pedald seed
