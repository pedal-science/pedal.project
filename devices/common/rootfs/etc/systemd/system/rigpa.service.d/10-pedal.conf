# The pedal's additions to rigpa's own unit (packaging/systemd/rigpa.service, installed beside the
# binary by the image build and scripts/deploy-rigpa). D14: the UI runs on the housekeeping core,
# below everything that matters, and never real-time.
[Unit]
# Only once there is a screen to drive: vc4's HDMI connectors exist when the KMS overlay is loaded
# (config-pedal.txt) and not otherwise. Without one, eglfs would fail and the unit would restart for
# ever; this skips it instead. rigpa can still be run by hand on vnc or offscreen (docs/vip-image.md).
ConditionPathExistsGlob=/sys/class/drm/card*-HDMI-A-*

[Service]
ExecStart=
ExecStart=/opt/rigpa/current/bin/rigpa --config /etc/rigpa/rigpa.json
CPUAffinity=0
Nice=5
IOSchedulingClass=idle
# First to go if memory runs out (vip has 1 GB): the pedal plays without its screen. MemoryMax is
# set from the D14 soak's numbers (plan V2), not guessed here.
OOMScoreAdjust=500
