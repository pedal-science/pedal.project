# The pedal's additions to rigpa's own unit (packaging/systemd/rigpa.service, installed beside the
# binary by the image build and scripts/deploy-rigpa). D14: the UI runs on the housekeeping core,
# below everything that matters, and never real-time.
[Unit]
# A rigpa that fails after its condition passed gives up after five tries in five minutes, rather than
# restarting every two seconds on the housekeeping core for ever (a wrong DRM device did, 2026-10-10).
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# Only when a screen is connected: vc4's HDMI connectors exist whenever the KMS overlay is loaded
# (vip-boot try-config), plugged in or not, and eglfs with nothing to drive fails, so the unit would
# restart for ever on the housekeeping core. A failed condition skips the unit instead. It is checked
# when the unit starts (at boot), so a screen plugged in later needs `systemctl start rigpa`. rigpa
# can still be run by hand on vnc or offscreen (rigpa's dev/vip-vnc).
ExecCondition=/bin/sh -c 'grep -qx connected /sys/class/drm/card*-HDMI-A-*/status'
ExecStart=
ExecStart=/opt/rigpa/current/bin/rigpa --config /etc/rigpa/rigpa.json
CPUAffinity=0
Nice=5
IOSchedulingClass=idle
# First to go if memory runs out (vip has 1 GB): the pedal plays without its screen. MemoryMax is
# set from the D14 soak's numbers (plan V2), not guessed here.
OOMScoreAdjust=500
