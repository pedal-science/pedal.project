# The pedal's boot splash (devices/vip/packages installs plymouth; the theme is the tree's).
# ShowDelay=0 so the first usable frame is the splash, not the console; DeviceTimeout gives the
# DSI panel's KMS stack in the initramfs time to appear before Plymouth falls back to text.
[Daemon]
Theme=pedal
ShowDelay=0
DeviceTimeout=8
UseFirmwareBackground=false
