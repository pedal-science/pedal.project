# The pedal service's user (docs/pedal-service.md, "Security"). It runs the one process with
# a port on the LAN that writes files, so it gets its own user and a sandbox rather than root;
# `pedal` is in dialout (the unit says so) to open the link UART.
#
# systemd-sysusers creates this, and `pedal-device` runs it for both a running host and the
# image build, so the user is configuration like everything else in this tree and not something
# somebody did to a board once. `pedald seed` (root, before namchaind) makes the tree under
# /var/lib/pedal belong to it.
u pedal - "pedal service" /var/lib/pedal /usr/sbin/nologin
