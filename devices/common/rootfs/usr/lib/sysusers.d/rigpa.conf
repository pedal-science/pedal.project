# rigpa's user (the pedal's UI, D14). It reads the library and the engine's token (a copy, through
# LoadCredential) and writes only its settings, so it gets its own user rather than pedal's or root.
# The unit adds video, render and input for the GPU and the touchscreen.
u rigpa - "rigpa, the pedal's UI" /var/lib/rigpa /usr/sbin/nologin
