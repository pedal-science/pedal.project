# Keep services off the render core. isolcpus stops the scheduler moving tasks onto core 3, but
# cgroup v2 resets a task's affinity to its cpuset, which is 0-3 without this. Must match
# HOUSEKEEPING_CPUS in /etc/pedal/tune.conf. Work that belongs on core 3 goes in pedal-rt.slice.
[Slice]
AllowedCPUs=0-2
