# tib — runtime tuning. Read by /usr/local/sbin/pedal-tune at boot and by `pedal-device check`.
#
# The CPU split is declared here and in two other places that pedal-tune checks against it:
#   - the kernel command line (rtpi, devices/tib/boot/boot.cmd):
#       isolcpus=managed_irq,domain,3 nohz_full=3 rcu_nocbs=3
#   - the slice drop-ins in this tree (system.slice.d, user.slice.d), which say 0-2.
# Change one and you must change the others; pedal-tune warns when they disagree.

# The core the render thread runs on. The kernel keeps everything else off it.
RT_CPUS="3"

# Everything else: services, logins, interrupts, kernel housekeeping. This is the kernel's own
# housekeeping set (the complement of isolcpus), so userspace and the kernel agree.
HOUSEKEEPING_CPUS="0-2"

# The clock cap. All four cores share one clock (cpufreq policy0), so thermal throttling caused by
# any core slows the render core too. Uncapped (1800 MHz) this board reaches its thermal trip under
# sustained load; rtpi's README says to cap it at 1416 MHz, and every tib number since 16 Sep was
# measured there. The cap used to be set by hand for each run and lost afterwards.
CPU_GOVERNOR="performance"
CPU_MAX_KHZ="1416000"

# The audio interrupt, matched by the controller's device-tree address rather than by IRQ number
# or USB bus number, both of which depend on probe order. The SSL 2+ sits behind the on-board hub
# on the dwc2 host controller at ff540000; every USB-A socket is downstream of it. dwc2 raises
# ~8000 interrupts/s whether or not audio is streaming.
AUDIO_IRQ_MATCH="ff540000.usb"

# Where that interrupt is delivered. Every interrupt on this board lands on cpu 0 by default, next
# to the SD card and the SDIO WiFi. Cpu 2 is a housekeeping core that carries no other device
# interrupt. Leave empty to leave the affinity alone. Unmeasured on tib (piv's equivalent halved
# its latency percentiles); the step 8 soak is the measurement.
AUDIO_IRQ_CPU="2"

# SCHED_FIFO priority of the interrupt's threads. Every other interrupt thread runs at 50, so a
# burst from the SD card or WiFi cannot delay delivery of audio data.
AUDIO_IRQ_PRIO="85"
