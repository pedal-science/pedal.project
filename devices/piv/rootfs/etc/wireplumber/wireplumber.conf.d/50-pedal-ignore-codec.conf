# Keep the desktop's audio session off the WM8960. Left to itself, WirePlumber opens the card
# after boot and sets its own volumes, overwriting the mixer state pedal-codec applies
# (/etc/pedal/codec/wm8960.mixer). namchaind drives the card directly through ALSA.
monitor.alsa.rules = [
  {
    # Matched by device.name: alsa.card_name does not match at this stage.
    matches = [ { device.name = "alsa_card.platform-soc_107c000000_sound" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
