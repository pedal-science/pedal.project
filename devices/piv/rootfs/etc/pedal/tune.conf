# piv — runtime tuning, while it stands in for tib. Read by /usr/local/sbin/pedal-tune at boot and
# by `pedal-device status`.
#
# The CPU split is declared here and in two other places that pedal-tune checks against it:
#   - the kernel command line (rtpi, devices/piv/device.env, AUDIO_TUNING_ARGS):
#       isolcpus=managed_irq,domain,2-3 nohz_full=2-3 rcu_nocbs=2-3 irqaffinity=0-1
#   - the slice drop-ins in this tree (system, user, machine), which say 0-1.
# Change one and you must change the others.

# The cores the kernel isolates. Core 3 renders; core 2 takes the audio interrupt (rtpi), and is
# where a second chain would go.
ISOLATED_CPUS="2-3"

# The core namchaind pins its render thread to.
RT_CPUS="3"

# Everything else: services, logins, containers, interrupts, kernel housekeeping.
HOUSEKEEPING_CPUS="0-1"

# No cap. piv (BCM2712 at 2.4 GHz, the Pi 500's keyboard-sized heatsink) held 33-41 C through
# namchain's soaks and the 2026-09-26 A2-Full measurements, with throttled=0x0. It has no cpufreq
# cooling device, so a throttle would show only in `vcgencmd get_throttled`.
CPU_GOVERNOR="performance"
CPU_MAX_KHZ="2400000"

# The audio interrupt is rtpi's on piv: rtpi-audio-tune (/etc/rtpi/audio-tune.conf) pins it to
# core 2 at SCHED_FIFO 85, finds it from the interface's USB id, and re-applies on replug. Empty
# here so the two never fight over it.
AUDIO_IRQ_MATCH=""
