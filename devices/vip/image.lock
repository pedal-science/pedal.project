# What devices/vip/make-card builds from (docs/vip-image.md). --lock rewrites the commits;
# the snapshot and the kernel change by hand, deliberately. Check namchain is the engine and
# rigpa the UI you mean, and that the kernel is the rebuild you mean (docs/vip-kernel-image.md).
snapshot=20260929T000000Z
pedal=cb3292ae64285592ce316b58a703c8bec6321f2c
rtpi=f8c3d7566a5b041a8afe2d924399b5066736dac8
namchain=eba5eef57897899dab2d7560661a620679a9048f
rigpa=179e202ce0c31a2ea097c8aec7602ece7766197c

# The pedal kernel: rtpi's rebuild, which is in no archive, so the image takes it from rtpi's
# build/vip/ as artefacts and pins it by hash — make-card verifies every one of these before the
# build starts, and the image build installs them. The spare slot boots the stock kernel instead,
# which devices/vip/packages installs as a package (rtpi's FALLBACK_KERNEL).
kernel=7.0.0-1017-raspi-realtime-numaemu3-dmaidle1-qled2-trimmed
kernel-kind=trimmed
# dmaidle1 plus the Waveshare 4.3″ DSI keep-list including drm_rp1_dsi (rtpi
# config/vip-keep.fragment). Built from rtpi 10eff4a (keep-list still uncommitted at pin time)
# and promoted on vip by vip-boot try-kernel on 2026-11-05. The spare slot on that boot kept
# qled1; a card from this lock puts the stock kernel back in the spare slot.
kernel-rtpi=10eff4a109372cc638359bca9186caddcb2aae6d
kernel-boot-sha256=97ceea4a7a78fb0bfaf07e679e1a4ff0d130fdb26de05a6159a15fed094e54a9
kernel-modules-sha256=3091a6fa710eacaec24cd1b30dcbb50a92d79689e3cc7b65d93c4c641321fb08
kernel-dtb-sha256=0fa45a2a1c0991f55ce426888f005c9cd75c35baa78d72aa4a670a4d60c60fe3
