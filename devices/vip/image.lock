# What devices/vip/make-card builds from (docs/vip-image.md). --lock rewrites the commits;
# the snapshot and the kernel change by hand, deliberately. Check namchain is the engine and
# rigpa the UI you mean, and that the kernel is the rebuild you mean (docs/vip-kernel-image.md).
snapshot=20260929T000000Z
pedal=8f9181bf0b77c22e74da138d21423666e25626bb
rtpi=9f9faaf1775e6855afd6d51419a85d9c74544e27
namchain=eba5eef57897899dab2d7560661a620679a9048f
rigpa=72bcf0b251039bc52f949ab2805ca41d49a7fa45

# The pedal kernel: rtpi's rebuild, which is in no archive, so the image takes it from rtpi's
# build/vip/ as artefacts and pins it by hash — make-card verifies every one of these before the
# build starts, and the image build installs them. The spare slot boots the stock kernel instead,
# which devices/vip/packages installs as a package (rtpi's FALLBACK_KERNEL).
kernel=7.0.0-1017-raspi-realtime-numaemu2-trimmed
kernel-kind=trimmed
# numaemu1 with the screen's drivers kept through the trim (rtpi config/vip-keep.fragment: vc4, v3d,
# USB HID). Built from rtpi 496fe8c and promoted on vip by vip-boot try-kernel on 2026-10-10.
kernel-rtpi=496fe8ce27b582d8c3ecef00cee1eedabee82388
kernel-boot-sha256=5c91185cea63bf17ca47e3bdffe4cfa9dd618e502d69c8467e1996227af97460
kernel-modules-sha256=33a9bce4c7a94b5dede363f4cf7488a8b697662287cab954159365a0ae7a31e1
kernel-dtb-sha256=1d1988efb6e918ffb516362cebef482f8f6c48bbb4462129b57e3d1888afd2c3
