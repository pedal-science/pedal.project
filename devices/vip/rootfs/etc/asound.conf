# The codec is ALSA's default on vip, so aplay, arecord, speaker-test, amixer and alsamixer need
# no -D or -c. It is card 2 behind the two HDMI cards, which were the default before.
# hw, not plughw: nothing is converted, so a file must already be in a format the codec takes
# (tox-32.wav: 2 channels, S32_LE, 48 kHz). `-D plughw:wm8960` converts anything else.
# Services name their device (namchaind.json), so this changes nothing they open.
pcm.!default {
	type hw
	card wm8960
}
ctl.!default {
	type hw
	card wm8960
}
