# vip — runtime tuning. Read by /usr/local/sbin/pedal-tune at boot and by `pedal-device status`.
#
# The CPU split is declared here and in two other places that pedal-tune checks against it:
#   - the kernel command line (rtpi, devices/vip/device.env, AUDIO_TUNING_ARGS), in the tuned
#     profile's cmdline-tuned.txt:
#       isolcpus=managed_irq,domain,1-3 nohz_full=1-3 rcu_nocbs=1-3 irqaffinity=0
#   - the slice drop-ins in this tree (system, user), which say 0.
# Change one and you must change the others. In the loose profile (vip-boot loose) none of this
# runs: pedal-tune isn't started.

# The cores the kernel isolates: every core but the housekeeping one. Core 3 is the *active* render
# core; cores 1 and 2 keep rigs warm, and core 1 also takes the audio interrupt (below).
ISOLATED_CPUS="1-3"

# The core namchaind pins its render thread to. This is the active render core, and no interrupt is
# delivered here: it is the one core whose preemption would be a missed deadline (D5).
RT_CPUS="3"

# Everything else: services, logins, containers, kernel housekeeping, WiFi, the SD card — and every
# interrupt except the audio one.
HOUSEKEEPING_CPUS="0"

# The Pi 5's 2.4 GHz, uncapped, as on piv (same SoC). Unverified on vip, whose cooling differs from
# the Pi 500's: `pedal-tune check` reports the temperature and any cpufreq throttle.
CPU_GOVERNOR="performance"
CPU_MAX_KHZ="2400000"

# The audio interrupt is the WM8960's: the RP1's DMA controller, which moves the I2S samples. It
# fires once per period per direction — 1,500/s duplex at the pedal's 64-frame period, around 2% of
# a core (the 3,000/s and ~5% in docs/audio-dma-irq.md is the 32-frame period measured on
# 2026-10-03) — and it goes on core 1: a render core, but never the active one, so the only thing it
# can preempt is a warm rig, which falls a block behind and catches up (D5). It runs SCHED_FIFO 85,
# above the render thread's 80, so it always preempts whatever it lands on. On vip this tree owns
# it: there is no USB interface, so rtpi's rtpi-audio-tune (piv's) isn't installed.
AUDIO_IRQ_MATCH="dw_axi_dmac_platform"
AUDIO_IRQ_CPU="1"
AUDIO_IRQ_PRIO="85"
