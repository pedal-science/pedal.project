# vip — runtime tuning. Read by /usr/local/sbin/pedal-tune at boot and by `pedal-device status`.
#
# The CPU split is declared here and in two other places that pedal-tune checks against it:
#   - the kernel command line (rtpi, devices/vip/device.env, AUDIO_TUNING_ARGS), in the tuned
#     profile's cmdline-tuned.txt:
#       isolcpus=managed_irq,domain,2-3 nohz_full=2-3 rcu_nocbs=2-3 irqaffinity=0-1
#   - the slice drop-ins in this tree (system, user), which say 0-1.
# Change one and you must change the others. In the loose profile (vip-boot loose) none of this
# runs: pedal-tune isn't started.

# The cores the kernel isolates. Core 3 renders; core 2 takes the audio interrupt, and is where a
# second chain would go.
ISOLATED_CPUS="2-3"

# The core namchaind pins its render thread to.
RT_CPUS="3"

# Everything else: services, logins, interrupts, kernel housekeeping.
HOUSEKEEPING_CPUS="0-1"

# The Pi 5's 2.4 GHz, uncapped, as on piv (same SoC). Unverified on vip, whose cooling differs from
# the Pi 500's: `pedal-tune check` reports the temperature and any cpufreq throttle.
CPU_GOVERNOR="performance"
CPU_MAX_KHZ="2400000"

# The audio interrupt is the WM8960's: the RP1's DMA controller, which moves the I2S samples. It
# fires once per period (750/s at 64 frames, 48 kHz) and can be moved to core 2
# (bench-results/vip-spike/codec.md). On vip this tree owns it: there is no USB interface, so
# rtpi's rtpi-audio-tune (piv's) isn't installed.
AUDIO_IRQ_MATCH="dw_axi_dmac_platform"
AUDIO_IRQ_CPU="2"
AUDIO_IRQ_PRIO="85"
