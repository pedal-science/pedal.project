# Keep the journal across a reboot (2026-10-09).
#
# Ubuntu's default is `Storage=auto`, which means persistent only if /var/log/journal exists — and
# it does not, so vip's journal is volatile. That cost us the cause of a reboot on 2026-10-09: the
# pedal restarted in the middle of T8's press storm and the previous boot's log was already gone, so
# "undervoltage", "thermal shutdown" and "kernel panic" were indistinguishable (and the firmware's
# low-voltage flag is live-only, cleared by the reboot it caused).
#
# A pedal that reboots by itself is a pedal whose log has to survive it. 200 MB is a bounded share of
# a 2.9 GB card (docs/vip-image.md sizes the roots), and it is the only record of what the last
# minute before a power event looked like.
[Journal]
Storage=persistent
SystemMaxUse=200M
