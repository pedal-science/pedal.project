# vip (a Pi 5) has three DRM devices: v3d (the GPU, render-only), drm-rp1-dsi (the box's Waveshare
# 4.3" DSI panel, 800x480, verified 2026-11-07 with Qt's own log: "DSI1 800 x 480 @ 60 hz") and vc4
# (HDMI). eglfs opens the first it finds, and on v3d it has no screen ("drmModeGetResources failed"),
# so kms.json names the panel's device by its stable path, not by a card number that depends on probe
# order. The rigpa.json beside it chooses the compact layout (rigpa docs/spec.md).
[Service]
Environment=QT_QPA_EGLFS_KMS_CONFIG=/etc/rigpa/kms.json
