# vip (a Pi 5) has two DRM devices: v3d (card0, the GPU, render-only) and vc4 (card1, the display).
# eglfs opens the first it finds, and on v3d it has no screen ("drmModeGetResources failed"), so
# kms.json names vc4 by its stable path rather than by a card number that depends on probe order.
[Service]
Environment=QT_QPA_EGLFS_KMS_CONFIG=/etc/rigpa/kms.json
