# Keep logins off vip's isolated cores (1-3). cgroup v2 resets a task's affinity to its cpuset,
# which is 0-3 without this. Must match HOUSEKEEPING_CPUS in /etc/pedal/tune.conf — one core, with
# the audio interrupt off it (D5). Work that belongs on a render core goes in pedal-rt.slice
# (`sudo pedal-rt <command>`).
[Slice]
AllowedCPUs=0
