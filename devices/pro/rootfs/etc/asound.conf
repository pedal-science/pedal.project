# The UMC202HD is ALSA's default, so aplay, arecord, speaker-test and amixer need no -D or -c; the
# board's own HDMI and HDA cards stay card 1+. hw, not plughw: nothing is converted (S32_LE, 2 ch,
# 44.1-192 kHz). Services name their device (namchaind.json), so this changes nothing they open.
pcm.!default {
	type hw
	card U192k
}
ctl.!default {
	type hw
	card U192k
}
