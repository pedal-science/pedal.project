# pro's journal: on disk and bounded.
#
# This replaces devices/common's file of the same name, which is `Storage=volatile` because the Pi
# hosts log to an SD card and a card has a write budget. pro logs to NVMe, and vip has since gone
# persistent anyway for the reason written in devices/vip/rootfs/etc/systemd/journald.conf.d/
# persistent.conf: a machine that reboots by itself is a machine whose log has to survive it, and a
# volatile journal cost us the cause of one.
#
# Ubuntu's default here is `Storage=auto` with /var/log/journal already present, so this changes the
# bound rather than the behaviour. 200 MB of a 100 GB root, as on vip.
[Journal]
Storage=persistent
SystemMaxUse=200M
Audit=no
