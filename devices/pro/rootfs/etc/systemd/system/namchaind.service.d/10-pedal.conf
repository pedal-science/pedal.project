# pro's additions to namchain's own unit (packaging/systemd/namchaind.service, installed beside the
# binaries by scripts/deploy-engine). It is devices/common's drop-in with the two Pi-only lines
# dropped: pro has no pedald to seed the rig (pedal-device does it from this tree instead), and the
# pedal user it would run as is made here all the same, because the library belongs to it.
[Unit]
# The TCP token: one for every Core host, so ljoss connects to any of them unchanged. deploy-engine
# makes one only on a host that has none.
ConditionPathExists=/etc/namchain/token
# The library is on its own logical volume, and the clock and the interrupt are set before the first
# block: pedal-tune is what puts the governor at performance, the audio interrupt on core 1 at
# SCHED_FIFO 85, and the deep C-states off the render cores.
RequiresMountsFor=/var/lib/pedal
Wants=pedal-tune.service
After=pedal-tune.service

[Service]
# The only slice allowed on the render cores (pedal-rt.slice, pro's copy, AllowedCPUs=0-5). A
# service gets no limits.d, which is why the unit itself sets LimitRTPRIO and LimitMEMLOCK.
Slice=pedal-rt.slice
ExecStart=
ExecStart=/opt/namchain/current/bin/namchaind --config /etc/namchain/namchaind.json
# The control thread compiles and prewarms rigs: ~20 ms of work per rig switch. namchain's unit runs
# the whole process SCHED_FIFO 80, which puts that thread at the render thread's priority and lets
# it onto a render core. Keep it on the one housekeeping core at normal priority instead; the render
# thread still pins itself to core 5 and takes SCHED_FIFO 80 itself (rt_priority, cpu in
# namchaind.json), and the warm threads pin themselves to the other render cores.
CPUAffinity=0
CPUSchedulingPolicy=other
# No CPUSchedulingPriority= line: an empty value is not "reset it", it is a parse error systemd
# logs on every start ("Failed to parse CPU scheduling priority, ignoring:"), and with the policy
# at `other` the priority has nothing to say anyway.
