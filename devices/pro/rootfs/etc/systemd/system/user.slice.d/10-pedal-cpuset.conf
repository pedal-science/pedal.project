# Keep logins off pro's isolated cores (1-5). cgroup v2 resets a task's affinity to its cpuset,
# which is 0-5 without this. Must match HOUSEKEEPING_CPUS in /etc/pedal/tune.conf — one core, with
# the audio interrupt off it (D5). Work that belongs on a render core goes in pedal-rt.slice
# (`sudo pedal-rt <command>`).
#
# This is also what makes a soak's `--cpu 5` from an ssh session fail unless it is run through
# pedal-rt: the session is in user.slice, and the cpuset refuses the pin.
[Slice]
AllowedCPUs=0
