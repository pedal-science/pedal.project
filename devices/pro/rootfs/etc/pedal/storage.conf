# pro — the library volume, made by `pedal-device apply` if it is missing. Plain KEY=value, sourced
# by bash. A host without this file (vip, piv) gets no storage stage: vip's pedal-data partition
# comes from its image, and piv uses its own root.
#
# This replaces devices/pro/rootfs/etc/pedal/pro.conf, which `pro-device` read before pro moved onto
# the Pi hosts' pedal-device.

# A logical volume in the installer's volume group, mounted where vip's pedal-data partition is.
# Created only if absent, and never re-made: an existing volume is left as it is, and never
# formatted. Sized on purpose, not "the rest of the drive": about 1.57 TB of the group stays
# unallocated, so either volume can grow with `lvextend -r`.
VG=ubuntu-vg
DATA_LV=pedal-data
DATA_SIZE=200G
DATA_MOUNT=/var/lib/pedal

# Who the library belongs to. `pedal` is the service user devices/common's sysusers.d file makes, as
# on vip: the scripts that write rigs (scripts/t9-rigs, scripts/soak/rig-switch-hour) chown to it by
# name, so a host that used a login name instead could not run them. The owner's login `rik` is put
# in group `audio` instead, which is what the realtime limits are written against.
PEDAL_USER=pedal
LOGIN_USER=rik
