# pro — runtime tuning. Read by /usr/local/sbin/pedal-tune at boot and by `pedal-device status`.
#
# The CPU split is declared here and in two other places that pedal-tune checks against it:
#   - the kernel command line (rtpi, devices/pro/device.env, AUDIO_TUNING_ARGS), in the boot
#     entries pro-boot writes:
#       isolcpus=managed_irq,domain,1-5 nohz_full=1-5 rcu_nocbs=1-5 irqaffinity=0 skew_tick=1
#   - the slice drop-ins in this tree (system, user), which say 0.
# Change one and you must change the others. In the loose profile (pro-boot loose) none of this
# runs: pedal-tune isn't started.
#
# The rules are vip's (docs/managing-processing-power-and-optimising-for-fast-switching.md, R1-R4),
# on six cores instead of four.

# The cores the kernel isolates: every core but the housekeeping one. Core 5 is the *active* render
# core; cores 1-4 keep rigs warm, and core 1 also takes the audio interrupt (below).
ISOLATED_CPUS="1-5"

# The core namchaind pins its render thread to. This is the active render core, and no interrupt is
# delivered here: it is the one core whose preemption would be a missed deadline (D5).
RT_CPUS="5"

# Everything else: services, logins, kernel housekeeping, WiFi, the NVMe queues — and every
# interrupt except the audio one.
HOUSEKEEPING_CPUS="0"

# The i5-9500T's 3.7 GHz turbo, uncapped. intel_pstate in active mode with the performance governor
# already runs at the ceiling, so this asserts rather than changes. A *lower* fixed cap is worth
# measuring (the five-core arm of bench-results/2026-10-31-cost-pro ran 6% slower than the one-core
# arm purely on clock), but a slower pedal is not obviously a better one, so it is not done here.
CPU_GOVERNOR="performance"
CPU_MAX_KHZ="3700000"

# The audio interrupt is the xHCI controller's: the UMC202HD is a USB 2.0 device on bus 1 of
# 0000:00:14.0, and that controller's two buses share one MSI, so there is exactly one interrupt to
# place. It carries about 8,000/s at the pedal's 64-frame period (54 million since boot), and it goes
# on core 1: a render core, but never the active one, so the only thing it can preempt is a warm rig,
# which falls a block behind and catches up (D5). It runs SCHED_FIFO 85, above the render thread's
# 80, so it always preempts whatever it lands on.
#
# Matched by name, not number: 124 today, but MSI numbers are allocation-order dependent and a
# kernel change renumbers them. The name is what /proc/interrupts' last column says.
#
# Left unsaid on purpose: the Intel Bluetooth on the same controller shares this interrupt. It is
# masked (etc/pedal/masked-units), so it contributes nothing.
AUDIO_IRQ_MATCH="xhci_hcd"
AUDIO_IRQ_CPU="1"
AUDIO_IRQ_PRIO="85"

# ---------------------------------------------------------------- x86-only, and why pro needs them
# These three knobs do nothing on a host that leaves them unset, so vip and piv are unchanged.

# Every *other* movable interrupt onto the housekeeping cores, checked as well as set.
# `irqaffinity=0` on the command line only sets the default mask at boot: a driver that asks for a
# specific CPU, and every interrupt that came up before the argument could apply, keeps what it
# chose. On pro that was not academic — iwlwifi was being delivered to core 4 and the xHCI to core
# 5, the render core, which is R4's exact failure. Managed (multiqueue) interrupts are the kernel's
# to place and are skipped: `isolcpus=managed_irq` is what keeps those off the isolated cores, and
# NVMe's six queues are the ones that matters for.
IRQ_HOUSEKEEPING="1"

# Deep C-states off on the render cores. intel_idle offers C1..C10 here, and C10's *exit* latency
# alone is 890 us against a 1,333 us deadline: a core that drops into it between blocks cannot be
# back in time. Everything with an exit latency over this many microseconds is disabled, on the
# isolated cores only, so the housekeeping core still saves power and runs cool. 50 keeps POLL, C1
# and C1E (2 and 10 us) and drops C3 upward (70 us and worse).
#
# This is cheaper than `intel_idle.max_cstate=` or `processor.max_cstate=` on the command line,
# which apply to every core, and it needs no reboot. It is also the first thing to suspect for the
# 2 ms stall that failed pro's first hour-long soak
# (bench-results/2026-10-31-soak-pro/README.md), though that one's wall time equalled its CPU time,
# which an idle-exit stall would not explain.
CPUIDLE_MAX_LATENCY_US="50"

# Unbound workqueues onto the housekeeping core. The default mask is every core (`3f` here), so any
# driver that queues work can land it on a render core. There is no command-line equivalent that
# covers unbound work: `isolcpus=domain` keeps the *scheduler* off those cores, not the workqueue
# pool's own affinity.
WORKQUEUE_CPUMASK="1"

# ---------------------------------------------------------------- the way in
# The WiFi interface, for pedal-wifi (power saving off) and for `pedal-device status`. The Pi hosts
# leave this unset and get `wlan0`; pro has predictable names.
WIFI_INTERFACE="wlp0s20f3"
